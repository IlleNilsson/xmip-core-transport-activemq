[package]
name = "xmip-core-transport-activemq"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-activemq"
description = "ActiveMQ transport: STOMP 1.2 to ActiveMQ Classic and Artemis — connect, send with receipt, subscribe with client-individual acknowledgement — a queue or topic is a Location. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Standard library otherwise: STOMP is a command, a
# few header lines and a body ended by NUL. Its declaration takes the
# capability's `timeout` (`transport::configured::timeout`).
transport = { workspace = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# An authority read as a URI writes it: the host, and the default port; a
# frame's lines and its NUL-ended body read under their ceilings, and the
# body ceiling itself.
net = { workspace = true, optional = true }
# The far end's login compared in constant time.
codec = { workspace = true, optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:net", "dep:codec"]
# The declaration alone.
declaration = []

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
