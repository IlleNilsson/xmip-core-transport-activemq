# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-activemq"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-activemq"
description = "ActiveMQ transport: STOMP 1.2 to ActiveMQ Classic and Artemis — connect, send with receipt, subscribe with client-individual acknowledgement — a queue or topic is a Location. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Standard library otherwise: STOMP is a command, a
# few header lines and a body ended by NUL.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
